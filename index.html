<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- META TAGS -->
    <link rel="icon" type="image/x-icon" href="images/logo-ezz.png">
    <title data-lang="meta-page-home"></title>
    <meta name="title" content="Ezz Exports company strictly specializing in Agricultural Export">
    <meta name="description"
        content="Ezz Exports combining deep expertise in handling fresh produce with a commitment to global quality standards.">
    <!-- TAGS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="preloader">
        <img src="images/logo-ezz.png" class="spinner">
        </img>
    </div>

    <!-- NAVBAR -->
    <nav id="navbar">
        <div class="logo">
            <a href="index.html"><img src="images/greenrow.png"
                    alt="Ezz Exports company strictly specializing in Agricultural Export"></a>
        </div>

        <div class="nav-links" id="navLinks">
            <a data-lang="nav-home" href="index.html" class="side-link"></a>
            <a data-lang="nav-about" href="pages/about.html" class="side-link"></a>
            <a data-lang="nav-Products" href="pages/products.html" class="side-link"></a>
            <a data-lang="nav-contact" href="pages/contact.html" class="side-link"></a>

            <div class="lang-dropdown">
                <button class="lang-btn" id="langBtn">EN</button>
                <div class="lang-menu" id="langMenu">
                    <button>EN</button>
                    <button>IT</button>
                    <button>AR</button>
                </div>
            </div>
        </div>

        <div class="menu-icon" id="menuIcon">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>
    <!-- SIDE MENU (Mobile) -->
    <div class="side-menu" id="sideMenu">
        <div class="side-logo">
            <img src="images/logo-ezz.png" alt="Azz Logo">
        </div>

        <a data-lang="nav-home" href="index.html"></a>
        <a data-lang="nav-about" href="pages/about.html"></a>
        <a data-lang="nav-Products" href="pages/products.html" class="side-link"></a>
        <a data-lang="nav-contact" href="pages/contact.html"></a>

        <div class="lang-dropdown">
            <button class="lang-btn" id="langBtnSide">EN</button>
            <div class="lang-menu" id="langMenuSide">
                <button>EN</button>
                <button>IT</button>
                <button>AR</button>
            </div>
        </div>
    </div>
    <!-- NAVBAR -->


    <!-- Hero Section -->
    <section class="hero">
        <video autoplay muted loop playsinline>
            <source src="images/Ezz-export3.mp4" type="video/mp4">
        </video>
        <div class="hero-content">
            <h1 data-lang="home-hero-h1"></h1>
            <p data-lang="home-hero-p"></p>
            <button data-lang="home-hero-button"></button>
        </div>
    </section>
    <!-- Hero Section -->


    <!-- BANERR SECTION -->
    <section class="category-banners">

        <div class="banner-item vegetables-banner">
            <div class="banner-content">
                <h2 data-lang="banner-veg-h2"></h2>
                <p data-lang="banner-veg-p"></p>
                <a href="pages/products.html" class="btn btn-primary" data-lang="banner-veg-btn"></a>
            </div>
        </div>

        <div class="banner-item fruits-banner">
            <div class="banner-content">
                <h2 data-lang="banner-fruit-h2"></h2>
                <p data-lang="banner-fruit-p"></p>
                <a href="pages/products.html" class="btn btn-primary" data-lang="banner-fruit-btn"></a>
            </div>
        </div>

    </section>
    <!-- BANERR SECTION -->


    <!-- Our Mission -->
    <section class="mission" id="missionSection">
        <img src="images/artichoke11.png"
            alt="Land planted with Egyptian artichokes, ready for export by Ezz Export Company">
        <div class="mission-content">
            <h2 style="color: #198754;" data-lang="home-mission-h2"></h2>
            <p data-lang="home-mission-p-1"></p>

            <hr class="mission-separator">

            <p data-lang="home-mission-p-2"></p>

        </div>
    </section>


    <!-- EXPORT JOURNEY SECTION -->
    <section class="export-journey" id="journey">
        <h2 style="color: #198754;" data-lang="home-journey-h2"></h2>
        <p class="journey-subtitle" data-lang="home-journey-p"></p>

        <div class="journey-gallery">
            <div class="journey-item">
                <img src="images/procss-1.png" alt="Harvesting">
                <div class="journey-overlay">
                    <h3 data-lang="home-journey-h3-1"></h3>
                    <p data-lang="home-journey-p-1"></p>
                </div>
            </div>

            <div class="journey-item">
                <img src="images/procss-2.jfif" alt="Sorting">
                <div class="journey-overlay">
                    <h3 data-lang="home-journey-h3-2"></h3>
                    <p data-lang="home-journey-p-2"></p>
                </div>
            </div>

            <div class="journey-item">
                <img src="images/procss-3.jfif" alt="Cold Storage">
                <div class="journey-overlay">
                    <h3 data-lang="home-journey-h3-3"></h3>
                    <p data-lang="home-journey-p-3">
                    <p>
                </div>
            </div>

            <div class="journey-item">
                <img src="images/procss-4.png" alt="Shipping">
                <div class="journey-overlay">
                    <h3 data-lang="home-journey-h3-4"></h3>
                    <p data-lang="home-journey-p-4"></p>
                </div>
            </div>
        </div>
    </section>
    <!-- EXPORT JOURNEY SECTION -->


    <!-- WhatsApp Floating Button -->
    <div class="whatsapp-wrapper">
        <a href="https://wa.me/201000000000" class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
        <div data-lang="whatsaap-button" class="whatsapp-tooltip"></div>
    </div>
    <!-- WhatsApp Floating Button -->


    <!-- Footer -->
    <footer class="footer" id="contact">
        <div class="footer-container">
            <!-- Logo -->
            <div class="footer-brand">
                <a href="index.html"><img class="footer-logo" src="images/logo-ezz.png"
                        alt="Ezz Exports company strictly specializing in Agricultural Export"></a>
                <p data-lang="footer-brand-p">
                </p>
            </div>

            <!-- Links -->
            <div class="footer-section">
                <h3 data-lang="footer-links-h3"></h3>
                <ul>
                    <li><a data-lang="footer-links-home" href="index.html"></a></li>
                    <li><a data-lang="footer-links-about" href="pages/about.html"></a></li>
                    <li><a data-lang="footer-links-products" href="pages/products.html"></a></li>
                    <li><a data-lang="footer-links-contact" href="pages/contact.html"></a></li>
                </ul>
            </div>

            <!-- Contact -->
            <div class="footer-section">
                <h3 data-lang="footer-contact-h3"></h3>
                <ul>
                    <li><i class="fa-solid fa-phone"></i> +20 111 222 3333</li>
                    <li><i class="fa-solid fa-envelope"></i> info@ezztrading.com</li>
                    <li data-lang="footer-contact-adress"><i class="fa-solid fa-location-dot"></i></li>
                </ul>
            </div>

            <!-- Social -->
            <div class="footer-section">
                <h3 data-lang="footer-social-h3"></h3>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                </div>
            </div>
        </div>

        <div class="footer-bottom" >
            <span data-lang="footer-bottom"></span>
            <br>
            <span data-lang="footer-bottom-span"></span> <a data-lang="footer-bottom-a" href="" target="_blank"></a>
        </div>
    </footer>
    <!-- Footer -->


    <script src="js/main.js"></script>
</body>

</html>
