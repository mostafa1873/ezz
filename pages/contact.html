    <!-- MAIN -->

    <main class="contact-main">

        <section class="contact-details-panel">
            <h1 class="section-heading" data-lang="contact-us-h1"></h1>
            <p data-lang="contact-intro-p"></p>

            <div class="detail-item">
                <i class="fa-solid fa-envelope"></i>
                <div>
                    <h3 data-lang="contact-page-h3-1"></h3>
                    <a href="mailto:info@ezztrading.com">info@ezztrading.com</a>
                </div>
            </div>

            <div class="detail-item">
                <i class="fa-solid fa-phone"></i>
                <div>
                    <h3 data-lang="contact-page-h3-2"></h3>
                    <a href="tel:+201112223333">+20 111 222 3333</a>
                </div>
            </div>

            <div class="detail-item">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <h3 data-lang="contact-page-h3-3"></h3>
                    <p data-lang="contact-page-p-1"></p>
                </div>
            </div>

            <div class="detail-item">
                <i class="fa-solid fa-clock"></i>
                <div>
                    <h3 data-lang="contact-page-h3-4"></h3>
                    <p data-lang="contact-page-p-2"></p>
                </div>
            </div>

        </section>

        <section class="contact-form-section">
            <h2 class="section-heading" data-lang="contact-form-h2"></h2>
            <form action="#" method="POST" class="contact-form">

                <div class="form-group">
                    <label data-lang="contact-page-label-1" for="name"></label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label data-lang="contact-page-label-2" for="company"></label>
                    <input type="text" id="company" name="company" placeholder="Required for business inquiries">
                </div>

                <div class="form-group">
                    <label data-lang="contact-page-label-3" for="email"></label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label data-lang="contact-page-label-4" for="phone"></label>
                    <input type="tel" id="phone" name="phone" placeholder="Include Country Code">
                </div>

                <div class="form-group">
                    <label data-lang="contact-page-label-5" for="message"></label>
                    <textarea id="message" name="message" rows="6" required
                        placeholder="Tell us about your needs and requirements..."></textarea>
                </div>

                <button type="submit" data-lang="contact-page-btn" class="submit-button"></button>
            </form>
        </section>

        <section class="location-map">
            <h2 class="section-heading" data-lang="map-h2"></h2>
            <div class="map-placeholder">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d110502.83402636783!2d31.189569032517878!3d30.05948950293297!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14583fa60e719369%3A0x6b876e4c70030238!2sCairo%2C%20Cairo%20Governorate!5e0!3m2!1sen!2seg!4v1704543788888!5m2!1sen!2seg"
                    width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </section>

    </main>

    <!-- MAIN -->

                </p>

            <!-- Contact -->

            </div>

            <!-- Social -->

                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">

            <br>
            <span data-lang="footer-bottom-span"></span> <a data-lang="footer-bottom-a" href="" target="_blank"></a>
